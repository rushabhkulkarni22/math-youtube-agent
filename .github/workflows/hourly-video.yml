name: Generate and upload one YouTube video

on:
  schedule:
    # GitHub cron is best-effort and can drop an individual event. Triggering
    # redundant checks makes the schedule self-healing; the gate below still
    # permits at most one real video attempt in a 50-minute window.
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hourly-youtube-video
  cancel-in-progress: false

jobs:
  generate-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      DRY_RUN: "false"
      YOUTUBE_PRIVACY: private
      VIDEOS_PER_DAY: "1"
      MANIM_QUALITY: low_quality

    steps:
      - uses: actions/checkout@v5

      - name: Enforce hourly cadence
        id: cadence
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "run_video=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last_change="$(git log -1 --format=%ct -- database/agent.db 2>/dev/null || echo 0)"
          now="$(date +%s)"
          if (( now - last_change >= 3000 )); then
            echo "run_video=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_video=false" >> "$GITHUB_OUTPUT"
            echo "A video attempt ran within the last 50 minutes; skipping this redundant trigger."
          fi

      - uses: actions/setup-python@v6
        if: steps.cadence.outputs.run_video == 'true'
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Manim and video dependencies
        if: steps.cadence.outputs.run_video == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg libcairo2-dev libffi-dev libpango1.0-dev pkg-config \
            texlive-fonts-recommended texlive-latex-base texlive-latex-extra \
            texlive-science dvisvgm fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Restore encrypted application credentials
        if: steps.cadence.outputs.run_video == 'true'
        env:
          YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          mkdir -p secrets database generated logs
          printf '%s' "$YOUTUBE_CLIENT_SECRET_JSON" > secrets/client_secret.json
          printf '%s' "$YOUTUBE_TOKEN_JSON" > secrets/youtube_token.json

      - name: Generate and upload one private video
        if: steps.cadence.outputs.run_video == 'true'
        run: python main.py --limit 1

      - name: Save upload progress
        if: always() && steps.cadence.outputs.run_video == 'true'
        run: |
          git config user.name "youtube-video-bot"
          git config user.email "youtube-video-bot@users.noreply.github.com"
          git add database/agent.db input/prompts.xlsx
          if ! git diff --cached --quiet; then
            git commit -m "chore: save automated video progress"
            git push
          fi
